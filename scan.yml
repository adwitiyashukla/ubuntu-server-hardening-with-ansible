- name: Score the server
  hosts: all
  become: true
  vars:
    scan_phase: after
    scan_dir: /root/hardening-scan
    scan_unit: prometheus-node-exporter.service
  tasks:
    - name: Install the scanners, plus the wrapper OpenSCAP needs to run its script checks from a noexec /tmp
      ansible.builtin.apt:
        name:
          - lynis
          - openscap-scanner
          - openscap-utils
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600

    - name: Create the scan folder
      ansible.builtin.file:
        path: "{{ scan_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy the CIS content
      ansible.builtin.copy:
        src: .lab/ssg-ubuntu2404-ds.xml
        dest: "{{ scan_dir }}/ssg-ubuntu2404-ds.xml"
        owner: root
        group: root
        mode: "0600"

    - name: Tell the CIS profile that ufw is the firewall
      ansible.builtin.copy:
        dest: "{{ scan_dir }}/tailoring.xml"
        owner: root
        group: root
        mode: "0600"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <xccdf:Tailoring xmlns:xccdf="http://checklists.nist.gov/xccdf/1.2" id="xccdf_hardening_tailoring_ufw">
            <xccdf:version time="2026-10-20T00:00:00">1</xccdf:version>
            <xccdf:Profile id="xccdf_hardening_profile_cis_level1_server" extends="xccdf_org.ssgproject.content_profile_cis_level1_server">
              <xccdf:title>CIS Level 1 Server with ufw</xccdf:title>
              <xccdf:set-value idref="xccdf_org.ssgproject.content_value_var_network_filtering_service">ufw</xccdf:set-value>
            </xccdf:Profile>
          </xccdf:Tailoring>

    - name: Run the CIS Level 1 Server scan
      ansible.builtin.command:
        cmd: >-
          oscap xccdf eval
          --profile xccdf_hardening_profile_cis_level1_server
          --tailoring-file tailoring.xml
          --results results.xml
          --report report.html
          ssg-ubuntu2404-ds.xml
        chdir: "{{ scan_dir }}"
      register: scan_oscap
      changed_when: false
      failed_when: scan_oscap.rc not in [0, 2]

    - name: Run Lynis
      ansible.builtin.command:
        cmd: lynis audit system --quick --no-colors --report-file {{ scan_dir }}/lynis-report.dat --logfile {{ scan_dir }}/lynis.log
      changed_when: false

    - name: Look for the node_exporter unit
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/{{ scan_unit }}
      register: scan_unit_file

    - name: Score the stock node_exporter unit and the sandboxed one the same way
      ansible.builtin.shell:
        cmd: |
          cp /usr/lib/systemd/system/{{ scan_unit }} stock-node-exporter.service
          cat stock-node-exporter.service /etc/systemd/system/{{ scan_unit }}.d/sandbox.conf > sandboxed-node-exporter.service
          systemd-analyze security --offline=true --no-pager stock-node-exporter.service > exposure-stock.txt
          systemd-analyze security --offline=true --no-pager sandboxed-node-exporter.service > exposure-sandboxed.txt
        chdir: "{{ scan_dir }}"
        executable: /bin/bash
      when: scan_unit_file.stat.exists
      changed_when: false

    - name: Fetch the results
      ansible.builtin.fetch:
        src: "{{ scan_dir }}/{{ item }}"
        dest: ".lab/scans/{{ scan_phase }}/"
        flat: true
      loop: "{{ scan_files + (scan_unit_file.stat.exists | ternary(scan_unit_files, [])) }}"
      vars:
        scan_files:
          - results.xml
          - report.html
          - lynis-report.dat
        scan_unit_files:
          - exposure-stock.txt
          - exposure-sandboxed.txt
