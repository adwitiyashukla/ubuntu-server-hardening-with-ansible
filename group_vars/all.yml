admin_user: ubuntu
ssh_group: sshusers

apt_upgrade: true
unattended_reboot: false
unattended_reboot_time: "03:00"
remove_packages:
  - apport
  - ftp
  - inetutils-telnet
  - nis
  - prelink
  - rsh-client
  - talk
  - telnet
  - tnftp

time_servers:
  - 0.ubuntu.pool.ntp.org
  - 1.ubuntu.pool.ntp.org
fallback_time_servers:
  - 2.ubuntu.pool.ntp.org
  - 3.ubuntu.pool.ntp.org

banner_text: Authorized users only. All activity may be monitored and reported.

password_max_days: 365
password_min_days: 1
password_warn_days: 7
password_inactive_days: 45
password_min_length: 14
password_min_classes: 4
password_max_repeat: 3
password_max_sequence: 3
password_diff_chars: 2
password_remember: 24
faillock_deny: 4
faillock_unlock_time: 900
shell_timeout: 900
default_umask: "027"
sudo_timeout: 15

ssh_log_level: INFO
ssh_max_auth_tries: 4
ssh_max_sessions: 10
ssh_max_startups: "10:30:60"
ssh_login_grace_time: 60
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 3
ssh_ciphers:
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
ssh_kex:
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - ecdh-sha2-nistp521
  - ecdh-sha2-nistp384
  - ecdh-sha2-nistp256
  - diffie-hellman-group-exchange-sha256

firewall_ssh_limit: true
firewall_allow_tcp: []

sysctl_settings:
  fs.protected_fifos: 2
  fs.protected_hardlinks: 1
  fs.protected_regular: 2
  fs.protected_symlinks: 1
  fs.suid_dumpable: 0
  kernel.dmesg_restrict: 1
  kernel.kptr_restrict: 2
  kernel.randomize_va_space: 2
  kernel.unprivileged_bpf_disabled: 1
  kernel.yama.ptrace_scope: 1
  net.core.bpf_jit_harden: 2
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.ip_forward: 0
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.all.forwarding: 0
  net.ipv6.conf.default.accept_ra: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.default.accept_source_route: 0

blocked_kernel_modules:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - usb-storage
  - dccp
  - sctp
  - rds
  - tipc

tmp_mount_options:
  - nodev
  - nosuid
  - noexec
tmp_size: 1G
grub_cmdline_extra:
  - apparmor=1
  - security=apparmor
  - audit=1
  - audit_backlog_limit=8192

journald_max_use: 500M
audit_immutable: true
aide_enabled: true

node_exporter_port: 9100
